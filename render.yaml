services:
  - type: web
    name: campuspass
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: SECURITY_USERNAME
        value: campus-security
      - key: SECURITY_PASSWORD
        generateValue: true
      - key: ADMIN_USERNAME
        value: campus-admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TEACHER_USERNAME
        value: campus-teacher
      - key: TEACHER_PASSWORD
        generateValue: true
